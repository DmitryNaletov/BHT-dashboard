# Файл .streamlit/secrets.toml
# Этот файл НЕ пушить в Git! Он только для локальной разработки.
# В Streamlit Cloud те же значения задаются через интерфейс → Settings → Secrets.

SUPER_ADMIN_PASSWORD = "super123"
